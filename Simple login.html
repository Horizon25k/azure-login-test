<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login</title>
<style>
:root{--bg:#eef2f3;--card:#fff;--ink:#16222b;--mute:#5d6b76;--line:#d3dde2;--acc:#0f6b6b;--acc-ink:#fff;--err:#b3261e;--ok:#1b6e3a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f171c;--card:#17232a;--ink:#e8eff2;--mute:#9bacb5;--line:#2c3c45;--acc:#4fc0b8;--acc-ink:#06201e;--err:#ff8a80;--ok:#7fd99b}}
:root[data-theme="dark"]{--bg:#0f171c;--card:#17232a;--ink:#e8eff2;--mute:#9bacb5;--line:#2c3c45;--acc:#4fc0b8;--acc-ink:#06201e;--err:#ff8a80;--ok:#7fd99b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px}
h1{font-size:1.5rem;margin:0 0 20px}
label{display:block;font-weight:600;font-size:.88rem;margin:14px 0 6px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;background:var(--acc);color:var(--acc-ink);font:700 1rem inherit;cursor:pointer}
.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
#msg{min-height:1.4em;margin:14px 0 0;font-size:.9rem;color:var(--err)}
.note{margin-top:16px;font-size:.8rem;color:var(--mute)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <section id="loginBox">
    <h1>Log in</h1>
    <label for="user">Username</label>
    <input id="user" autocomplete="username">
    <label for="pass">Password</label>
    <input id="pass" type="password" autocomplete="current-password">
    <p id="msg" role="alert"></p>
    <button id="btn">Log in</button>
    <p class="note">Demo login: username <b>admin</b>, password <b>1234</b></p>
  </section>

  <section id="welcomeBox" hidden>
    <h1 id="welcome"></h1>
    <p>You are logged in.</p>
    <button class="ghost" id="logout">Log out</button>
  </section>
</main>

<script>
// Change these two values to set your own login
var CORRECT_USER = "admin";
var CORRECT_PASS = "1234";

var msg = document.getElementById("msg");

function login() {
  var user = document.getElementById("user").value.trim();
  var pass = document.getElementById("pass").value;

  if (user === "" || pass === "") {
    msg.textContent = "Enter your username and password.";
  } else if (user !== CORRECT_USER) {
    msg.textContent = "Username not found.";
  } else if (pass !== CORRECT_PASS) {
    msg.textContent = "Wrong password. Try again.";
  } else {
    // user and password are both correct
    msg.textContent = "";
    document.getElementById("welcome").textContent = "Welcome, " + user + "!";
    document.getElementById("loginBox").hidden = true;
    document.getElementById("welcomeBox").hidden = false;
  }
}

function logout() {
  document.getElementById("pass").value = "";
  document.getElementById("welcomeBox").hidden = true;
  document.getElementById("loginBox").hidden = false;
}

document.getElementById("btn").onclick = login;
document.getElementById("logout").onclick = logout;
document.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !document.getElementById("loginBox").hidden) login();
});
</script>
</body>
</html>
